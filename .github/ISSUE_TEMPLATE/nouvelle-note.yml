name: 💡 Proposer une note
description: Suggérer une vidéo, un exercice ou une idée à ajouter au second cerveau
title: "[note] "
labels: ["nouvelle-note"]
body:
  - type: input
    id: sujet
    attributes:
      label: Sujet
      description: En quelques mots, de quoi ça parle
      placeholder: "Ex : dérivée d'une fonction composée"
    validations:
      required: true
  - type: dropdown
    id: matiere
    attributes:
      label: Matière
      options:
        - Maths
        - Maths expert
        - SES
        - Orientation
        - Méthodes
        - Autre
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Lien (vidéo, exercice, article...)
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explique ce que ça contient, pourquoi c'est utile, à quoi ça se rattache
    validations:
      required: true
